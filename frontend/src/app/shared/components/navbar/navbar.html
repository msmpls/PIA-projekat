<nav class="navbar">
  <a routerLink="/home" class="logo">SportSphere Hub</a>

  <ul class="nav-links">
    <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a></li>
    <li><a routerLink="/search" routerLinkActive="active">Search</a></li>

    <ng-container *ngIf="isGuest(); else authenticated">
      <li><a routerLink="/login" routerLinkActive="active">Login</a></li>
      <li><a routerLink="/register" routerLinkActive="active">Register</a></li>
    </ng-container>

    <ng-template #authenticated>
      <ng-container *ngIf="isAdmin(); else regularUser">
        <li><a routerLink="/admin/facility-requests" routerLinkActive="active">Facilities</a></li>
        <li><a routerLink="/admin/users" routerLinkActive="active">Users</a></li>
        <li><a routerLink="/admin/reg-requests" routerLinkActive="active">Registrations</a></li>
      </ng-container>

      <ng-template #regularUser>
        <li><a routerLink="/search" routerLinkActive="active">Search</a></li>
        <li><a routerLink="/profile" routerLinkActive="active">Profile</a></li>
        <li><a routerLink="/my-reservations" routerLinkActive="active">Reservations</a></li>
        <li class="nav-greeting">Hello, {{ userName() }}</li>
      </ng-template>

      <li><button type="button" (click)="logout()">Logout</button></li>
    </ng-template>
  </ul>
</nav>
