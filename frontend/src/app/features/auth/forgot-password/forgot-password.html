<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.6"/>
          <path d="M12 6V12L16 14" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>SportSphere</span>
      </div>
      <h2>Zaboravljena lozinka</h2>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="identifier">Korisničko ime ili email</label>
        <input
          id="identifier"
          type="text"
          formControlName="identifier"
          placeholder="Unesite korisničko ime ili email"
        />
        <small class="error" *ngIf="form.get('identifier')?.invalid && form.get('identifier')?.touched">
          Ovo polje je obavezno.
        </small>
      </div>

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Slanje...' : 'Generiši reset link' }}
      </button>

      <div *ngIf="message()" class="status-toast" [class.success]="message()!.type === 'success'"
           [class.error]="message()!.type === 'error'">
        {{ message()!.text }}
      </div>

      <button *ngIf="resetToken()" type="button" class="reset-link-btn" (click)="goToReset()">
        → Postavi novu lozinku
      </button>

      <p class="register-link">
        <a routerLink="/login">← Nazad na prijavu</a>
      </p>
    </form>
  </div>
</div>
