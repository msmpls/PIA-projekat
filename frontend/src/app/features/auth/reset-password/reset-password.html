<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="11" width="14" height="10" rx="2" stroke="white" stroke-width="1.6"/>
          <path d="M8 11V7C8 4.79 9.79 3 12 3S16 4.79 16 7V11" stroke="white" stroke-width="1.6"/>
        </svg>
        <span>SportSphere</span>
      </div>
      <h2>Nova lozinka</h2>
    </div>

    <!-- Checking token -->
    <div class="auth-form" *ngIf="tokenValid() === null">
      <p class="status-text">Provera tokena...</p>
    </div>

    <!-- Invalid token -->
    <div class="auth-form" *ngIf="tokenValid() === false">
      <div class="status-toast error">
        Token je nevažeći ili je istekao (vazi 30 minuta).
      </div>
      <p class="register-link">
        <a routerLink="/forgot-password">Zatražite novi reset link</a>
      </p>
    </div>

    <!-- Valid token - reset form -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form" *ngIf="tokenValid() === true">
      <div class="form-group">
        <label for="newPassword">Nova lozinka</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Unesite novu lozinku"
        />
        <small class="error" *ngIf="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
          8-12 karaktera, počinje slovom, bar jedno veliko slovo, broj i specijalni karakter.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Potvrdite lozinku</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Ponovite novu lozinku"
        />
        <small class="error" *ngIf="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched">
          Potvrda lozinke je obavezna.
        </small>
      </div>

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Čuvanje...' : 'Postavi novu lozinku' }}
      </button>

      <div *ngIf="message()" class="status-toast" [class.success]="message()!.type === 'success'"
           [class.error]="message()!.type === 'error'">
        {{ message()!.text }}
      </div>
    </form>
  </div>
</div>
