<div class="auth-container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <h2>Prijava na sistem</h2>

    <div class="form-group">
      <label for="username">Korisničko ime</label>
      <input 
        id="username" 
        type="text" 
        formControlName="username" 
        placeholder="Unesite korisničko ime"
      >
      @if (form.get('username')?.invalid && form.get('username')?.touched) {
        <small class="error">Korisničko ime je obavezno.</small>
      }
    </div>

    <div class="form-group">
      <label for="password">Lozinka</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="Unesite lozinku"
      >
      @if (form.get('password')?.invalid && form.get('password')?.touched) {
        <small class="error">Lozinka je obavezna.</small>
      }
    </div>

    <button type="submit" [disabled]="form.invalid">Uloguj se</button>

    <p class="register-link">
      Nemate nalog? <a routerLink="/register">Registrujte se ovde</a>
    </p>
  </form>
</div>
