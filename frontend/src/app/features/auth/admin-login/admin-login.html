<div class="auth-container">
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    <h2>Admin prijava</h2>

    <div class="form-group">
      <label for="username">Korisničko ime</label>
      <input id="username" type="text" formControlName="username" placeholder="Unesite korisničko ime">
    </div>

    <div class="form-group">
      <label for="password">Lozinka</label>
      <input id="password" type="password" formControlName="password" placeholder="Unesite lozinku">
    </div>

    <button type="submit" [disabled]="form.invalid">Uloguj se kao admin</button>

    <p class="error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
  </form>
</div>
