<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.6"/>
          <path d="M12 2C12 2 8 6 8 12C8 18 12 22 12 22" stroke="white" stroke-width="1.6"/>
          <path d="M12 2C12 2 16 6 16 12C16 18 12 22 12 22" stroke="white" stroke-width="1.6"/>
          <path d="M2 12H22" stroke="white" stroke-width="1.6"/>
        </svg>
        <span>SportSphere</span>
      </div>
      <h2>Admin prijava</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Unesite korisničko ime"
        />
        <small class="error" *ngIf="form.get('username')?.invalid && form.get('username')?.touched">Korisničko ime je obavezno.</small>
      </div>
      <div class="form-group">
        <label for="password">Lozinka</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Unesite lozinku"
        />
        <small class="error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Lozinka je obavezna.</small>
      </div>
      <button type="submit" [disabled]="form.invalid">Uloguj se kao admin</button>
      <p class="error form-error" *ngIf="errorMessage()">{{ errorMessage() }}</p>
    </form>
  </div>
</div>
